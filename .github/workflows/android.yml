name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Play download-size budget for an arm64 phone (docs/PLAN.md section 4: target 15 MB, fail above 18 MB).
  SIZE_BUDGET_BYTES: '18874368' # 18 MiB
  # Installed arm64 splits are ~1.5x the download (native libs are stored uncompressed), so they get
  # their own, larger budget.
  INSTALLED_BUDGET_BYTES: '31457280' # 30 MiB
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'
  # gradle.properties is sized for the 2 GB local PC (-Xmx1536m). The runner has far more memory
  # and runs lint for three modules plus lintRelease in one daemon (Metaspace/heap OOM was seen
  # locally), so every Gradle call below overrides the daemon JVM args with -Dorg.gradle.jvmargs.
  CI_GRADLE_JVMARGS: '-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        # Explicit bash runs with -eo pipefail, so a failing command inside a pipe fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests, lint and debug build
        run: >-
          ./gradlew --stacktrace "-Dorg.gradle.jvmargs=$CI_GRADLE_JVMARGS"
          :engine:test :engine:koverVerify
          :ar:testDebugUnitTest :data:testDebugUnitTest :app:testDebugUnitTest
          :ar:lintDebug :data:lintDebug :app:lintDebug
          :app:assembleDebug

      # Catches unreviewed SDKs (e.g. ad mediation adapters) reaching the release APK.
      - name: Dependency guard (release runtime classpath)
        run: |
          ./gradlew -q "-Dorg.gradle.jvmargs=$CI_GRADLE_JVMARGS" :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/deps.txt"
          python3 ci/dependency_guard.py check "$RUNNER_TEMP/deps.txt" ci/release-dependencies.txt

      - name: Decode release keystore (if configured)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the release APK is signed with a throwaway debug key (fine for testing, not for Play)."
          fi

      # Runs on pull requests too (signed with the debug key) so the size and 16 KB gates apply before merge.
      - name: Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          REQUIRE_RELEASE_CONFIG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then echo "::warning::AdMob secrets not set: the release build uses Google test ads."; fi
          ./gradlew --stacktrace "-Dorg.gradle.jvmargs=$CI_GRADLE_JVMARGS" :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: R8 metadata (r8.json from the AAB)
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          mkdir -p "$RUNNER_TEMP/r8"
          ENTRIES=$(unzip -Z1 "$AAB" | grep -iE '(^|/)r8[^/]*\.json$' || true)
          if [ -z "$ENTRIES" ]; then
            echo "::warning::No r8*.json found in the AAB (AGP may have moved it)."
          else
            for e in $ENTRIES; do unzip -o -j -q "$AAB" "$e" -d "$RUNNER_TEMP/r8"; echo "Extracted $e"; done
            ls -l "$RUNNER_TEMP/r8"
          fi

      - name: Locate build tools
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using $BUILD_TOOLS"

      - name: 16 KB page-size check (native libraries)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if ! "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" > "$RUNNER_TEMP/zipalign.txt"; then
            grep -v "(OK" "$RUNNER_TEMP/zipalign.txt"
            echo "::error::zipalign -P 16 verification failed"
            exit 1
          fi
          tail -n 1 "$RUNNER_TEMP/zipalign.txt"
          python3 ci/check_native_libs.py "$APK" --forbid filamat --summary "$GITHUB_STEP_SUMMARY"

      - name: Permission allowlist check
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          PKG=$("$BUILD_TOOLS/aapt2" dump packagename "$APK")
          # Ignore the package-private permissions AndroidX generates (<applicationId>.*).
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | grep -v "^$PKG\." | sort > "$RUNNER_TEMP/permissions.txt" || true
          echo "Merged permissions:"; cat "$RUNNER_TEMP/permissions.txt"
          if ! diff -u <(sort ci/allowed-permissions.txt) "$RUNNER_TEMP/permissions.txt"; then
            echo "::error::Release manifest permissions differ from ci/allowed-permissions.txt"
            exit 1
          fi

      - name: Size budget (arm64)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          BT="java -jar $RUNNER_TEMP/bundletool.jar"
          SPEC=ci/device-spec-arm64.json
          $BT build-apks --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/app.apks" --device-spec="$SPEC"
          # Compressed download size Play would serve to an arm64 phone (MIN,MAX in bytes).
          DOWNLOAD=$($BT get-size total --apks="$RUNNER_TEMP/app.apks" --device-spec="$SPEC" | tail -n 1 | cut -d, -f2)
          # Size of the APK splits actually installed on that phone.
          $BT extract-apks --apks="$RUNNER_TEMP/app.apks" --device-spec="$SPEC" --output-dir="$RUNNER_TEMP/arm64"
          INSTALLED=$(cat "$RUNNER_TEMP"/arm64/*.apk | wc -c)
          UNIVERSAL=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          for n in "$DOWNLOAD" "$INSTALLED"; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::Could not measure the arm64 size (got '$n')."; exit 1; }
          done
          mib() { awk -v b="$1" 'BEGIN { printf "%.2f MiB", b / 1048576 }'; }
          {
            echo "### Size (arm64-v8a phone)"
            echo ""
            echo "| Measure | Size |"
            echo "|---|---:|"
            echo "| Play download (bundletool get-size, max) | $(mib "$DOWNLOAD") |"
            echo "| Installed arm64 APK splits | $(mib "$INSTALLED") |"
            echo "| Universal release APK (arm64 + armeabi-v7a) | $(mib "$UNIVERSAL") |"
            echo "| Download budget | $(mib "$SIZE_BUDGET_BYTES") |"
            echo "| Installed budget | $(mib "$INSTALLED_BUDGET_BYTES") |"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"
          FAIL=0
          if [ "$DOWNLOAD" -gt "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::arm64 Play download is over the budget ($(mib "$SIZE_BUDGET_BYTES"))."
            FAIL=1
          fi
          if [ "$INSTALLED" -gt "$INSTALLED_BUDGET_BYTES" ]; then
            echo "::error::arm64 installed size is over the budget ($(mib "$INSTALLED_BUDGET_BYTES"))."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: spaceview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK, AAB and mapping
        uses: actions/upload-artifact@v7
        with:
          name: spaceview-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload R8 metadata
        uses: actions/upload-artifact@v7
        with:
          name: r8-metadata
          path: ${{ runner.temp }}/r8/
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

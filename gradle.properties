# Local PC has ~2 GB free RAM: keep the daemon small and build one project at a time.
# CI overrides org.gradle.jvmargs with a larger heap and Metaspace (CI_GRADLE_JVMARGS in
# .github/workflows/android.yml); the other settings are shared so local and CI builds match.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
# Run the Kotlin compiler inside the Gradle daemon instead of a second JVM (saves ~0.5-1 GB).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

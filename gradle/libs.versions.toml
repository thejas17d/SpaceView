[versions]
agp = "9.4.1"
# Kotlin 2.4.21: SceneView 4.65.0 is compiled against kotlin-stdlib 2.4.21 (Kotlin 2.4 metadata),
# which a 2.3.x compiler cannot read.
kotlin = "2.4.21"
# KSP2 (2.3.x) is decoupled from the Kotlin compiler version; 2.3.10+ supports Kotlin 2.4.
ksp = "2.3.12"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
splashscreen = "1.2.0"
datastore = "1.3.0"
room = "2.8.5"
work = "2.11.2"
profileinstaller = "1.4.1"
serialization = "1.11.0"
coroutines = "1.11.0"
arcore = "1.57.0"
sceneview = "4.65.0"
playServicesAds = "25.5.0"
ump = "4.0.0"
billing = "9.1.0"
review = "2.0.2"
# SM1b (Builder A): ML Kit image labelling through Google Play services (unbundled: the model is not in the APK).
# Pinned. A bump needs the TESTING §21 device check "chip appears with the model present": SpaceView initialises ML Kit
# through its sdkinternal MlKitContext (the init provider is removed), and a change there fails silently.
mlkitImageLabeling = "16.0.8"
# PLAN v3 W2 (Builder B): ML Kit Subject Segmentation for background-free cutouts. Google Play services only (there is
# no bundled variant: the model is downloaded by Play services, nothing in the APK). Beta; 16.0.0-beta1 is the only
# release (checked on Google Maven 2026-11-24). It raises the shared ML Kit common / vision-common versions, so the
# TESTING §21 naming check applies to it as well.
mlkitSubjectSegmentation = "16.0.0-beta1"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Robolectric 4.17 (2026): runs :data's Room migration test on the JVM in CI (ARCHITECTURE-v2 R2, §9 fallback).
robolectric = "4.17"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
arcore = { module = "com.google.ar:core", version.ref = "arcore" }
sceneview-ar = { module = "io.github.sceneview:arsceneview", version.ref = "sceneview" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
# M5: Play In-App Review (plain artifact, not -ktx: no extra coroutines-play-services dependency).
play-review = { module = "com.google.android.play:review", version.ref = "review" }
play-services-mlkit-image-labeling = { module = "com.google.android.gms:play-services-mlkit-image-labeling", version.ref = "mlkitImageLabeling" }
play-services-mlkit-subject-segmentation = { module = "com.google.android.gms:play-services-mlkit-subject-segmentation", version.ref = "mlkitSubjectSegmentation" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
# Kover 0.9.11 (Sep 2026): JVM coverage for :engine (M1 gate >= 90% lines). Inline version so this is append-only.
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.11" }
